name: Dong goi KeHoachXa.exe
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cai trinh bien dich Windows
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip unzip
      - name: Tao goi KeHoachXa
        run: sh tools/build_embedded.sh "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        with:
          name: KeHoachXa
          path: ${{ runner.temp }}/out/KeHoachXa
